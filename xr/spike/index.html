<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>케이프혼타워 XR</title>
<style>html,body{margin:0;background:#111;color:#ddd;font:14px system-ui,sans-serif}#khxr-boot{padding:24px}</style>
</head>
<body>
<div id="khxr-boot">3D 모델을 불러오는 중입니다…</div>
<script>
/*
  케이프혼타워 XR 래퍼
  - Wing 원본(../new/3d-model.html)을 수정하지 않고 그대로 불러온 뒤,
    앱 스크립트 직전에 XR 계층(kh-xr.js)만 끼워 넣어 실행한다.
  - ?src=   다른 원본 경로 지정(기본 ../new/3d-model.html)
  - ?emu=1  퀘스트 3 에뮬레이터(IWER)로 데스크톱에서 XR 시험
*/
(async () => {
  const q = new URLSearchParams(location.search);
  const src = new URL(q.get('src') || '../new/3d-model.html', location.href);
  const here = new URL('./', location.href);
  const v = '20261030a';
  let html;
  try {
    const r = await fetch(src, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    html = await r.text();
  } catch (e) {
    document.getElementById('khxr-boot').textContent = '원본 3D 페이지를 불러오지 못했습니다 (' + e.message + ')';
    return;
  }
  // 원본의 상대 경로가 그대로 동작하도록 base 지정
  const head = `<base href="${src.href}">`;
  // 에뮬레이터는 원본 스크립트보다 먼저 설치되어야 한다
  const emu = q.get('emu')
    ? `<script src="${here}../vendor/iwer-2.7.0.min.js"><\/script><script src="${here}kh-xr-emu.js?v=${v}"><\/script>`
    : '';
  const hook = `<script src="${here}kh-xr-spike.js?v=${v}"><\/script>`;
  // 앱 스크립트(THREE.WebGLRenderer 를 처음 만드는 인라인 스크립트) 바로 앞에 XR 계층을 넣는다
  const at = html.indexOf('new THREE.WebGLRenderer');
  const cut = at < 0 ? -1 : html.lastIndexOf('<script', at);
  if (cut < 0) {
    document.getElementById('khxr-boot').textContent = '원본 구조를 인식하지 못했습니다 (WebGLRenderer 생성 위치 없음)';
    return;
  }
  html = html.slice(0, cut) + hook + html.slice(cut);
  html = html.replace(/<head([^>]*)>/i, m => m + head + emu);
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
