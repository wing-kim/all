<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XR 기기 점검</title>
<style>
  :root { --bg:#f6f7f8; --fg:#1d2328; --mut:#5b6670; --ok:#1f7a4d; --bad:#b3362c; --card:#fff; --line:#dde2e6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181b; --fg:#e8ecef; --mut:#9aa6b0; --ok:#5fd39a; --bad:#ff8a7f; --card:#1d2328; --line:#2c343a; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; } p.sub { color:var(--mut); margin:0 0 20px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  td { padding:10px 12px; border-top:1px solid var(--line); vertical-align:top; } tr:first-child td { border-top:0; }
  td:first-child { width:46%; color:var(--mut); } .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; }
  .btns { display:flex; flex-wrap:wrap; gap:10px; margin:20px 0; }
  button { font:inherit; font-weight:600; padding:12px 18px; border-radius:10px; border:0; background:#1f5f8b; color:#fff; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  pre { white-space:pre-wrap; word-break:break-all; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>XR 기기 점검</h1>
  <p class="sub">예전 실사 3D(WebGPU)를 이 기기의 VR에서 그릴 수 있는지 확인합니다. 두 버튼을 차례로 눌러 주세요. 각 시험은 VR에 2초 들어갔다가 자동으로 나옵니다(초록 화면이면 성공).</p>
  <table id="t"></table>
  <div class="btns">
    <button id="b-gl">1. WebGL로 VR 그리기</button>
    <button id="b-gpu">2. WebGPU로 VR 그리기</button>
  </div>
  <pre id="log">점검 중…</pre>
</main>
<script>
// 이 기기에서 WebGPU를 WebXR에 연결해 그릴 수 있는지(XRGPUBinding) 실제로 세션을 열어 확인한다
const rows = [], log = [];
const $t = document.getElementById('t'), $log = document.getElementById('log');
function row(k, v, good) { rows.push([k, v, good]); render(); }
function note(s) { log.push(s); render(); }
function render() {
  $t.innerHTML = rows.map(([k, v, g]) => `<tr><td>${k}</td><td class="${g === true ? 'ok' : g === false ? 'bad' : ''}">${v}</td></tr>`).join('');
  $log.textContent = [navigator.userAgent].concat(rows.map(r => r[0] + ': ' + r[1]), log).join('\n');
}
async function inspect() {
  row('브라우저', navigator.userAgent.match(/OculusBrowser\/[\d.]+|Chrome\/[\d.]+|Safari\/[\d.]+/)?.[0] || '알 수 없음');
  const xr = navigator.xr;
  row('WebXR', xr ? '있음' : '없음', !!xr);
  if (xr) {
    for (const m of ['immersive-vr', 'immersive-ar']) { let s = false; try { s = await xr.isSessionSupported(m); } catch (e) {} row(m, s ? '지원' : '미지원', s); }
  }
  row('WebGPU(navigator.gpu)', navigator.gpu ? '있음' : '없음', !!navigator.gpu);
  if (navigator.gpu) {
    try {
      const a = await navigator.gpu.requestAdapter({ xrCompatible: true });
      row('WebGPU 어댑터(XR 호환 요청)', a ? '얻음' : '못 얻음', !!a);
      if (a && a.info) row('GPU', [a.info.vendor, a.info.architecture, a.info.description].filter(Boolean).join(' / ') || '정보 없음');
    } catch (e) { row('WebGPU 어댑터', '오류: ' + e.message, false); }
  }
  row('XRGPUBinding(WebGPU↔XR 연결)', typeof XRGPUBinding === 'function' ? '있음' : '없음', typeof XRGPUBinding === 'function');
}
function endSoon(session, ms) { setTimeout(() => session.end().catch(() => {}), ms); }

document.getElementById('b-gl').onclick = async () => {
  try {
    const canvas = document.createElement('canvas'), gl = canvas.getContext('webgl2', { xrCompatible: true });
    const session = await navigator.xr.requestSession('immersive-vr');
    const layer = new XRWebGLLayer(session, gl); session.updateRenderState({ baseLayer: layer });
    const ref = await session.requestReferenceSpace('local');
    let frames = 0;
    session.requestAnimationFrame(function f(t, fr) {
      if (fr.getViewerPose(ref)) { gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer); gl.clearColor(0.1, 0.7, 0.35, 1); gl.clear(gl.COLOR_BUFFER_BIT); frames++; }
      session.requestAnimationFrame(f);
    });
    session.addEventListener('end', () => { row('1. WebGL VR 그리기', frames > 0 ? `성공 (${frames}프레임)` : '세션은 열렸지만 프레임 없음', frames > 0); });
    endSoon(session, 2000);
  } catch (e) { row('1. WebGL VR 그리기', '실패: ' + e.message, false); }
};

document.getElementById('b-gpu').onclick = async () => {
  let session;
  try {
    if (!navigator.gpu) throw new Error('WebGPU 없음');
    if (typeof XRGPUBinding !== 'function') throw new Error('XRGPUBinding 없음');
    const adapter = await navigator.gpu.requestAdapter({ xrCompatible: true }); if (!adapter) throw new Error('XR 호환 어댑터 없음');
    const device = await adapter.requestDevice();
    session = await navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['webgpu'] });
    const binding = new XRGPUBinding(session, device), fmt = binding.getPreferredColorFormat();
    const layer = binding.createProjectionLayer({ colorFormat: fmt });
    session.updateRenderState({ layers: [layer] });
    const ref = await session.requestReferenceSpace('local');
    let frames = 0;
    session.requestAnimationFrame(function f(t, fr) {
      const pose = fr.getViewerPose(ref);
      if (pose) {
        const enc = device.createCommandEncoder();
        for (const v of pose.views) {
          const sub = binding.getViewSubImage(layer, v);
          const pass = enc.beginRenderPass({ colorAttachments: [{ view: sub.colorTexture.createView(sub.getViewDescriptor ? sub.getViewDescriptor() : undefined), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0.1, g: 0.7, b: 0.35, a: 1 } }] });
          pass.end();
        }
        device.queue.submit([enc.finish()]); frames++;
      }
      session.requestAnimationFrame(f);
    });
    session.addEventListener('end', () => { row('2. WebGPU VR 그리기', frames > 0 ? `성공 (${frames}프레임) → 예전 실사 3D를 VR로 옮길 수 있음` : '세션은 열렸지만 프레임 없음', frames > 0); });
    endSoon(session, 2000);
  } catch (e) {
    if (session) session.end().catch(() => {});
    row('2. WebGPU VR 그리기', '실패: ' + e.message, false);
  }
};
inspect().then(() => note('점검 끝. 이 화면을 캡처해 알려 주세요.'));
</script>
</body>
</html>
