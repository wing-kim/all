<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탐색 성능 개선 비교</title><style>body{font:16px/1.6 system-ui;margin:32px;background:#eff3f3;color:#183235}h1{font-size:26px}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;background:white;border-radius:12px;padding:14px}img{width:100%;display:block}h2{font-size:18px;margin:0 0 10px}a{color:#126765}small{color:#586668}@media(max-width:900px){section{grid-template-columns:1fr}}</style><h1>회전 후 기다리지 않는 기본 탐색</h1><p><a href="../../new/3d-model.html?lab=review">통합 뷰어 열기 →</a> · <a href="../../new/360/">기존 AI 실사와 비교 →</a></p><section><figure><h2>이전 · 자동 정밀 렌더 완료 화면</h2><img src="interactive-before.png" alt="이전 자동 광선 추적 완료 화면"><p>정밀 완성 약 78초 / 각도 변경 후 약 54초<br><small>고품질 64샘플 + 노이즈 제거</small></p></figure><figure><h2>변경 · 기본 실시간 탐색 화면</h2><img src="interactive-after.png" alt="새 기본 실시간 탐색 화면"><p>초기 준비 약 14~17초 / 회전 후 누적 렌더 대기 없음<br><small>환경 반사·유리 투명도·실시간 그림자·접촉 음영. 정밀 이미지는 별도 버튼.</small></p></figure></section><p>동일한 Mac의 Chrome, 기계식·올 글라스 기본 구도. 로컬 서버와 브라우저 캐시를 사용한 관찰값이며 기기별 보장값은 아닙니다. 두 화면은 렌더링 방식이 다릅니다. 실시간 화면은 정밀 광선 추적과 같은 반사·굴절 정확도를 제공하지 않습니다.</p><p>시안·층수·층고를 변경해도 원본 모델을 사용합니다. 전체 라이트맵 베이킹은 아직 적용하지 않았습니다.</p></html>
